# Static website for osuite.business. Prices and business details are fetched
# by the browser from api.osuite.business, so nothing here needs restarting.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  # /pricing -> pricing.html (the build writes pages as files).
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
  # Hashed assets never change: cache them for a year.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /media/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
  error_page 404 /404.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
}
